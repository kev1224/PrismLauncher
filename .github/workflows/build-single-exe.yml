name: Build Single File Exe
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download and Extract Prism Launcher Portable
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/PrismLauncher/PrismLauncher/releases/download/8.4/PrismLauncher-Windows-MSVC-Portable-8.4.zip" -OutFile "prism.zip"
          Expand-Archive -Path "prism.zip" -DestinationPath "PrismBuild"

      - name: Create 7-Zip SFX Configuration
        shell: powershell
        run: |
          # Create a configuration file instructing 7z to execute the file silently
          $configText = @'
          ;!@Install@!UTF-8!
          Title="Prism Launcher Standalone"
          Progress="no"
          ExecuteFile="prismlauncher.exe"
          ;!@InstallEnd@!
          '@
          Set-Content -Path "config.txt" -Value $configText -Encoding UTF8

      - name: Compile Folder into Single Exe
        shell: powershell
        run: |
          # 1. Compress the PrismBuild folder files into a standard 7z archive
          & "C:\Program Files\7-Zip\7z.exe" a -mx9 "app.7z" ".\PrismBuild\*"
          
          # 2. Download the official 7-Zip SFX Module for GUI applications
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2408-extra.7z" -OutFile "7z-extra.7z"
          & "C:\Program Files\7-Zip\7z.exe" e "7z-extra.7z" "7zCon.sfx" -o.
          
          # 3. Combine the SFX module, our config file, and the archive into a standalone executable
          gc -Encoding Byte 7zCon.sfx, config.txt, app.7z | sc -Encoding Byte PrismLauncher_Standalone.exe

      - name: Upload Single File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-SingleFile
          path: PrismLauncher_Standalone.exe
